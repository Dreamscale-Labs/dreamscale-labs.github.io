-anchor="end" font-weight="400">Transport V1</text><rect x="290" y="272" width="419.6" height="34" fill="#8b918d"/><text x="721.6" y="297.0" font-size="23" fill="#212121" text-anchor="start" font-weight="400">420 ms</text><text x="274.0" y="339.0" font-size="23" fill="#212121" text-anchor="end" font-weight="400">Off-the-shelf WebRTC</text><rect x="290" y="314" width="504.1" height="34" fill="#c9792b"/><text x="806.1" y="339.0" font-size="23" fill="#212121" text-anchor="start" font-weight="400">504 ms</text><text x="0.0" y="406.0" font-size="22" fill="#686868" text-anchor="start" font-weight="400">p99.9</text><text x="274.0" y="447.0" font-size="23" fill="#212121" text-anchor="end" font-weight="600">Transport V2</text><rect x="290" y="422" width="389.4" height="34" fill="#0047ab"/><text x="691.4" y="447.0" font-size="23" fill="#212121" text-anchor="start" font-weight="600">389 ms</text><text x="274.0" y="489.0" font-size="23" fill="#212121" text-anchor="end" font-weight="400">Transport V1</text><rect x="290" y="464" width="872.4" height="34" fill="#8b918d"/><text x="1174.4" y="489.0" font-size="23" fill="#212121" text-anchor="start" font-weight="400">872 ms</text><text x="274.0" y="531.0" font-size="23" fill="#212121" text-anchor="end" font-weight="400">Off-the-shelf WebRTC</text><rect x="290" y="506" width="992.1" height="34" fill="#c9792b"/><text x="1294.1" y="531.0" font-size="23" fill="#212121" text-anchor="start" font-weight="400">992 ms</text></g><text x="90.0" y="848.0" font-size="22" fill="#686868" text-anchor="start" font-weight="400">Network time per request, three-camera observations at 4 Hz, one home Wi-Fi link to a US West cloud host.</text><text x="1510.0" y="848.0" font-size="22" fill="#212121" text-anchor="end" font-weight="600">dreamscalelabs.com</text></svg>
