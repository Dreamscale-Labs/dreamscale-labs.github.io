<!doctype html>
<!-- Source for og-image.png, the 1200x630 link preview. Re-render it with
     assets/social/render-og-image.sh after changing this page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Dreamscale Labs social preview</title>
<style>
@font-face { font-family: Unbounded; src: url('/assets/fonts/Unbounded-Latin-Variable.woff2') format('woff2'); font-weight: 200 900; font-display: block; }
@font-face { font-family: DSL; src: url('/assets/fonts/Mluvka-Regular-web.woff2') format('woff2'); font-display: block; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #17191a; -webkit-font-smoothing: antialiased; }
.card { position: relative; width: 1200px; height: 630px; padding: 60px 72px; isolation: isolate; }
.brand { display: block; width: 236px; height: auto; }
h1 { position: relative; z-index: 1; font-family: Unbounded, sans-serif; font-size: 66px; font-weight: 450; letter-spacing: -.052em; line-height: 1.16; max-width: 640px; margin: 74px 0 26px; }
p { position: relative; z-index: 1; font-family: DSL, Arial, sans-serif; font-size: 25px; line-height: 1.45; color: #65696c; max-width: 500px; margin: 0; }
.domain { position: absolute; left: 72px; bottom: 54px; font-family: DSL, Arial, sans-serif; font-size: 21px; color: #0047ab; }
.cloud-art { position: absolute; z-index: 0; top: 0; right: 0; bottom: 0; width: 64%; mask-image: linear-gradient(to right, transparent 0%, transparent 6%, #000 40%, #000 100%); }
.cloud-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, white, transparent 14%, transparent 86%, white); }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="card">
<img class="brand" src="/assets/landing/brand.svg" alt="Dreamscale Labs">
<h1>The real-time cloud for physical AI</h1>
<p>Fast, reliable and private infrastructure for robot training and inference.</p>
<div class="domain">dreamscalelabs.com</div>
<div class="cloud-art"><canvas id="cloud-canvas"></canvas></div>
</div>
<script>
// One still frame of the homepage's dotted cloud (assets/landing/cloud-hero.js).
(() => {
  const canvas = document.getElementById('cloud-canvas');
  const ctx = canvas.getContext('2d');
  const outer = new Path2D("M1376.96 88.5695C1372.33 88.594 1365.03 88.6165 1360.63 89.0954C1198.28 100.041 1031.71 194.573 925.956 316.108C918.736 324.404 910.493 334.263 904.052 343.133C823.509 298.837 756.097 323.228 690.276 379.914C646.303 275.622 529.29 302.992 447.191 338.828C335.924 387.395 233.136 462.101 153.48 553.851C126.757 584.63 90.8763 627.128 109.329 670.151C111.742 675.683 114.836 680.894 118.538 685.661C127.943 697.855 140.253 708.973 150.339 720.703C155.067 726.201 160.258 731.583 165.115 736.995C174.425 747.368 182.076 756.746 193.981 764.244C217.098 778.805 243.173 778.466 269.266 778.127C272.558 778.085 275.849 778.042 279.135 778.029C292.22 778.019 305.363 777.833 318.521 777.647C333.883 777.43 349.266 777.213 364.604 777.274L988.91 776.389L1179.26 776.475C1189.06 776.475 1198.76 776.553 1208.4 776.631C1257.95 777.03 1305.8 777.416 1355.65 767.05C1451.39 747.142 1536.62 703.207 1606.54 634.868C1699.66 543.846 1769.08 376.809 1660.33 269.437C1653.74 262.97 1647.06 256.609 1640.27 250.359C1621.6 233.436 1624.45 235.004 1613.27 213.222C1607.26 201.72 1600.2 190.792 1592.2 180.574C1540.11 114.96 1458.5 88.1381 1376.96 88.5695Z");

  const width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width;
  canvas.height = height;
  const scale = Math.min(width * 0.7 / 1600, height * 0.52 / 690);
  const centerX = width * 0.6, centerY = height * 0.5;
  for (const outline of [false, true]) {
    const weight = Number(outline);
    ctx.fillStyle = `rgb(0 ${71 * weight} ${171 * weight})`;
    ctx.beginPath();
    for (let y = 6; y < height; y += 8) {
      for (let x = 6; x < width; x += 8) {
        const sx = (x - centerX) / scale + 890, sy = (y - centerY) / scale + 433.5;
        if ((ctx.isPointInPath(outer, sx, sy) && !ctx.isPointInPath(inner, sx, sy)) !== outline) continue;
        const pulse = Math.abs(Math.sin(x * y));
        const radius = 1.5 * pulse + weight * (2 + 0.5 * pulse);
        ctx.moveTo(x + radius, y);
        ctx.arc(x, y, radius, 0, Math.PI * 2);
      }
    }
    ctx.fill();
  }
})();
</script>
