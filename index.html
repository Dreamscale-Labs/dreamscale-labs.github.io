<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="DSL is an applied research company working towards a future of truly general robots."
    >
    <title>Dreamscale Labs</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <link
      rel="preload"
      href="/assets/logo/dreamscale-labs.svg"
      as="image"
      type="image/svg+xml"
      fetchpriority="high"
    >
    <link rel="preload" href="/assets/fonts/Mluvka-Regular-web.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles-75.css">
  </head>
  <body>
    <header class="site-header" aria-label="Primary navigation">
      <a class="site-logo" href="/" aria-label="Dreamscale Labs home">
        <img
          src="/assets/logo/dsl-mark.png"
          alt=""
          width="1302"
          height="960"
          fetchpriority="high"
        >
      </a>
      <nav>
        <a class="nav-link" href="/blog/">Blog</a>
      </nav>
    </header>

    <main class="landing" aria-labelledby="wordmark">
      <div class="hero-lockup">
        <h1 class="wordmark" id="wordmark" aria-label="Dreamscale Labs">
          <img
            class="wordmark-image"
            src="/assets/logo/dreamscale-labs.svg"
            alt=""
            width="1024"
            height="520"
            fetchpriority="high"
            decoding="async"
            aria-hidden="true"
          >
        </h1>
        <a class="dropbear-cta" href="https://dropbear.dreamscalelabs.com">
          <img
            class="dropbear-cta-logo"
            src="/assets/logo/dropbear-logo.svg"
            alt=""
            width="1254"
            height="1254"
            decoding="async"
            aria-hidden="true"
          >
          <span>Introducing Dropbear: fast cloud inference for robotics</span>
        </a>
      </div>
      <p class="tagline">DSL is an applied research company working towards a future of truly general robots.</p>
    </main>
  </body>
</html>
